<svg id="sheet" viewBox="0 0 1800 1260" role="img" aria-label="Six logo concepts for Keel Autopilot: Refraction, Plumb, Even keel, Buoy, Handled and Ballast"></svg>
<script>
const INK = "#0b1220", BLUE = "#2f5bff", PAPER = "#f2f4f8", MUTED = "#4a5466";
const ON_PAPER = { ink: INK, acc: BLUE, bg: PAPER };
const ON_INK = { ink: PAPER, acc: "#5b80ff", bg: INK };
let n = 0;

// lowercase geometric "keel", drawn as strokes in currentColor
function wm(sw, parts) {
  const id = "k" + (n++);
  let s = `<g fill="none" stroke="currentColor" stroke-width="${sw}">`;
  s += `<path d="M5 4V72"/><clipPath id="${id}"><rect x="0" y="30" width="46" height="42"/></clipPath>`;
  s += `<g clip-path="url(#${id})"><path d="M8 56L38 22M17 46L40 76"/></g>`;
  if (parts === "keel") s += `<path d="M56 51H93"/><path d="M88 51A16 16 0 1 0 83.3 62.3"/><path d="M102 51H139"/><path d="M134 51A16 16 0 1 0 129.3 62.3"/><path d="M151 4V72"/>`;
  return s + "</g>";
}

// cut a currentColor drawing at the waterline: ink above, blue below, optional sideways shift below
function split(inner, wl, gap, box, c, dx = 0, above = inner) {
  const a = "c" + (n++), b = "c" + (n++);
  const [x0, y0, x1, y1] = box;
  return `<clipPath id="${a}"><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${wl - gap / 2 - y0}"/></clipPath>` +
    `<clipPath id="${b}"><rect x="${x0}" y="${wl + gap / 2}" width="${x1 - x0}" height="${y1 - wl - gap / 2}"/></clipPath>` +
    `<g clip-path="url(#${a})" style="color:${c.ink}">${above}</g>` +
    `<g transform="translate(${dx} 0)"><g clip-path="url(#${b})" style="color:${c.acc}">${inner}</g></g>`;
}

const refraction = parts => ({
  wl: 44.25, bb: parts === "keel" ? { x: -0.5, y: 4, w: 162, h: 68 } : { x: -0.5, y: 4, w: 50, h: 68 },
  svg: c => split(wm(11, parts), 44.25, 2.5, [-8, 0, 172, 80], c, 5),
});
const plumb = {
  wl: 36, bb: { x: 26, y: 6, w: 48, h: 90 },
  svg: c => split(`<path fill="currentColor" d="M50 6L74 36L50 96L26 36Z"/>`, 36, 4, [0, 0, 100, 100], c),
};
const evenKeel = {
  wl: 40, bb: { x: 11, y: 11, w: 78, h: 78 },
  svg: c => split(`<rect fill="currentColor" x="18" y="18" width="64" height="64" rx="13" transform="rotate(-14 50 50)"/>`, 40, 4, [0, 0, 100, 100], c),
};
const buoy = {
  wl: 34, bb: { x: 6, y: 6, w: 88, h: 88 },
  svg: c => split(`<circle fill="currentColor" cx="50" cy="50" r="44"/>`, 34, 4, [0, 0, 100, 100], c) +
    `<path d="M39 36H62L54.5 75Q52.5 80 50 75Z" fill="${c.bg}"/>`,
};
const handled = {
  wl: 38, bb: { x: 16, y: 6, w: 72, h: 80 },
  svg: c => split(`<path d="M17 28L42 80L82 12" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`, 38, 4, [0, 0, 100, 100], c, 0,
    `<path d="M42 80L82 12" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>`),
};
const ballast = parts => {
  const x1 = parts === "keel" ? 153.25 : 44;
  return {
    wl: 81, bb: { x: 2.75, y: 4, w: x1 - 2.75, h: 112 },
    svg: c => `<g style="color:${c.ink}">${wm(4.5, parts)}</g><rect x="2.75" y="86" width="${x1 - 2.75}" height="30" fill="${c.acc}"/>` +
      (parts === "keel" ? `<text x="${(2.75 + x1) / 2 + 3.4}" y="105.2" text-anchor="middle" font-family="Jura" font-size="11.5" letter-spacing="6.8" fill="${c.bg}">AUTOPILOT</text>` : ""),
  };
};

// place a mark so its waterline sits on a given y, or so its visual centre sits on a point
const onLine = (m, cx, y, s, c) => `<g transform="translate(${cx - s * (m.bb.x + m.bb.w / 2)} ${y - s * m.wl}) scale(${s})">${m.svg(c)}</g>`;
const centred = (m, cx, cy, s, c) => `<g transform="translate(${cx - s * (m.bb.x + m.bb.w / 2)} ${cy - s * (m.bb.y + m.bb.h / 2)}) scale(${s})">${m.svg(c)}</g>`;
const fit = (m, size) => size / Math.max(m.bb.w, m.bb.h);

const MARKS = [
  { name: "Refraction", note: "The word bends where it enters the water.", hero: refraction("keel"), s: 2.1, icon: refraction("k"), type: true },
  { name: "Plumb", note: "A small sail, a deep keel, one true line.", hero: plumb, s: 2.3, icon: plumb },
  { name: "Even keel", note: "The box tips. The line stays level.", hero: evenKeel, s: 2.5, icon: evenKeel },
  { name: "Buoy", note: "A little shows. Most of it is below.", hero: buoy, s: 2.15, icon: buoy },
  { name: "Handled", note: "A tick that reaches under the surface.", hero: handled, s: 2.3, icon: handled },
  { name: "Ballast", note: "Light above. The weight sits underneath.", hero: ballast("keel"), s: 2.0, icon: ballast("k"), type: true },
];

const W = 1800, H = 1260, L = 48, R = 1752, T = 48, B = 1212, HEAD = 120, FOOT = 1160;
const CW = (R - L) / 3, CH = (FOOT - HEAD) / 2, DATUM = 204;
const mono = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-family="DMMono" font-size="${o.size || 11}" letter-spacing="${o.ls ?? 1.6}" fill="${o.fill || MUTED}" text-anchor="${o.anchor || "start"}">${t}</text>`;
const hair = (d, o = 0.16, w = 1) => `<path d="${d}" stroke="${INK}" stroke-opacity="${o}" stroke-width="${w}" fill="none"/>`;

let s = `<rect width="${W}" height="${H}" fill="${PAPER}"/>`;

// frame, bays, station ticks
s += hair(`M${L} ${T}H${R}V${B}H${L}Z`, 0.55);
s += hair(`M${L} ${HEAD}H${R}M${L} ${FOOT}H${R}M${L} ${HEAD + CH}H${R}M${L + CW} ${HEAD}V${FOOT}M${L + 2 * CW} ${HEAD}V${FOOT}`);
for (let i = 0; i <= 60; i++) {
  const x = L + i * (R - L) / 60, major = i % 10 === 0;
  s += hair(`M${x} ${T}v${major ? -12 : i % 5 === 0 ? -8 : -5}M${x} ${B}v${major ? 12 : i % 5 === 0 ? 8 : 5}`, 0.45);
  if (major) s += mono(x, T - 18, i / 10, { size: 9, anchor: "middle", ls: 0 });
}
for (let j = 0; j <= 40; j++) {
  const y = T + j * (B - T) / 40, len = j % 5 === 0 ? 8 : 5;
  s += hair(`M${L} ${y}h${-len}M${R} ${y}h${len}`, 0.45);
}

// header and footer
s += mono(L + 28, 90, "KEEL AUTOPILOT", { size: 12, ls: 3.4, fill: INK });
s += mono(L + 218, 90, "IDENTITY STUDY 03", { size: 12, ls: 3.4 });
s += `<text x="${W / 2}" y="92" text-anchor="middle" font-family="ISerif" font-size="22" fill="${MUTED}">what holds it steady is out of sight</text>`;
s += mono(R - 28, 90, "SIX MARKS · ONE WATERLINE", { size: 12, ls: 3.4, anchor: "end" });
s += `<rect x="${L + 28}" y="1180" width="12" height="12" fill="${INK}"/>` + mono(L + 50, 1190.5, "INK 0B1220");
s += `<rect x="${L + 178}" y="1180" width="12" height="12" fill="${BLUE}"/>` + mono(L + 200, 1190.5, "BLUE 2F5BFF");
s += mono(W / 2, 1190.5, "INK ABOVE THE LINE · BLUE BELOW IT", { anchor: "middle" });
s += mono(R - 28, 1190.5, "02.10.2026 · NOT TO SCALE", { anchor: "end" });

// the two datum lines, drawn before the marks so they show through each waterline gap
[0, 1].forEach(r => {
  const y = HEAD + r * CH + DATUM;
  s += `<path d="M${L} ${y}H${R}" stroke="${BLUE}" stroke-opacity="0.5" stroke-width="0.9"/>`;
  s += mono(L + 10, y - 7, "WL", { size: 9, fill: BLUE, ls: 1 }) + mono(R - 10, y - 7, "WL", { size: 9, fill: BLUE, ls: 1, anchor: "end" });
});

MARKS.forEach((m, i) => {
  const x0 = L + (i % 3) * CW, y0 = HEAD + Math.floor(i / 3) * CH, cx = x0 + CW / 2;
  // centreline and specimen
  s += `<path d="M${cx} ${y0 + 22}V${y0 + 352}" stroke="${INK}" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="9 4 2 4"/>`;
  s += onLine(m.hero, cx, y0 + DATUM, m.s, ON_PAPER);
  // title
  s += mono(x0 + 40, y0 + 392, String(i + 1).padStart(2, "0"), { size: 11 });
  s += `<text x="${x0 + 68}" y="${y0 + 393}" font-family="ISerif" font-size="31" fill="${INK}">${m.name}</text>`;
  s += mono(x0 + 40, y0 + 417, m.note, { size: 11, ls: 0.4 });
  s += hair(`M${x0 + 40} ${y0 + 434}H${x0 + CW - 40}`, 0.12);
  // in use: lockup, profile pictures, tab icon
  const uy = y0 + 476;
  if (i === 5) {
    s += centred(m.hero, x0 + 92, uy, 0.62, ON_PAPER);
  } else if (m.type) {
    s += centred(m.hero, x0 + 96, uy - 8, 0.7, ON_PAPER);
    s += `<text x="${x0 + 40}" y="${uy + 31}" font-family="Jura" font-size="8.6" letter-spacing="5.2" fill="${MUTED}">AUTOPILOT</text>`;
  } else {
    s += centred(m.icon, x0 + 62, uy, fit(m.icon, 42), ON_PAPER);
    s += `<g transform="translate(${x0 + 98} ${uy - 26}) scale(0.5)" style="color:${INK}">${wm(10, "keel")}</g>`;
    s += `<text x="${x0 + 99}" y="${uy + 25}" font-family="Jura" font-size="8.6" letter-spacing="5.2" fill="${MUTED}">AUTOPILOT</text>`;
  }
  s += `<circle cx="${x0 + 366}" cy="${uy}" r="30" fill="${INK}"/>` + centred(m.icon, x0 + 366, uy, fit(m.icon, 31), ON_INK);
  s += `<circle cx="${x0 + 440}" cy="${uy}" r="29.5" fill="${PAPER}" stroke="${INK}" stroke-opacity="0.22"/>` + centred(m.icon, x0 + 440, uy, fit(m.icon, 31), ON_PAPER);
  s += `<rect x="${x0 + 494}" y="${uy - 12}" width="24" height="24" rx="5" fill="${INK}"/>` + centred(m.icon, x0 + 506, uy, fit(m.icon, 14), ON_INK);
});

document.getElementById("sheet").innerHTML = s;
</script>
</body></html>
